[package]
name = "gpui-grid"
version = "0.1.0"
edition = "2024"

# Spike only: path deps into a shallow clone of Zed at d2a4fb6ded7c470be25d1541281da3882495b65b.
# The real app will use git = "https://github.com/zed-industries/zed", rev = "...".
[dependencies]
gpui = { path = "/home/todd/src/zed-d2a4fb6/crates/gpui" }
gpui_platform = { path = "/home/todd/src/zed-d2a4fb6/crates/gpui_platform", features = ["font-kit", "x11", "wayland"] }
image = { version = "0.25.1", default-features = false, features = ["jpeg"] }
smallvec = "1"

# Copied from Zed's workspace: gpui relies on these forks, and [patch] isn't inherited by path deps.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.release]
debug = "line-tables-only"
